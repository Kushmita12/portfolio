<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Quiz Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="score-box">Score: <span id="score">0</span></div>
        <div id="timer-bar-container"><div id="timer-bar"></div></div>
        <canvas id="gameCanvas" width="500" height="700"></canvas>
        <div id="question-box">Loading...</div>
        <div id="feedback-banner"></div>
        <div id="controls">
            <button class="answer-btn" onclick="checkAnswer(0)"></button>
            <button class="answer-btn" onclick="checkAnswer(1)"></button>
            <button class="answer-btn" onclick="checkAnswer(2)"></button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
